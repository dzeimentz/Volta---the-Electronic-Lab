<?xml version="1.0" encoding="UTF-8"?>
<!-- Entwurf MCU Explorer: gruene Platine mit Steckleiste; das M ist eine Leiterbahn, deren obere Enden in die
     Steckleiste fuehren (»an die Pins angeschlossen«); eine LED-Balkenanzeige mit drei Segmenten zeigt den Band. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#052E16"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <!-- Steckleiste -->
  <rect x="226" y="108" width="572" height="84" rx="16" fill="#111827"/>
  <rect x="258" y="132" width="36" height="36" rx="6" fill="#C9A45C"/><rect x="326" y="132" width="36" height="36" rx="6" fill="#C9A45C"/><rect x="394" y="132" width="36" height="36" rx="6" fill="#C9A45C"/><rect x="462" y="132" width="36" height="36" rx="6" fill="#C9A45C"/><rect x="530" y="132" width="36" height="36" rx="6" fill="#C9A45C"/><rect x="598" y="132" width="36" height="36" rx="6" fill="#C9A45C"/><rect x="666" y="132" width="36" height="36" rx="6" fill="#C9A45C"/><rect x="734" y="132" width="36" height="36" rx="6" fill="#C9A45C"/>
  <!-- Zuleitungen von den Pins zum M -->
  <g stroke="#0B3B24" stroke-width="40" stroke-linecap="round" fill="none">
    <path d="M276 170 L276 300"/><path d="M748 170 L748 300"/>
  </g>
  <g stroke="#34D399" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M276 170 L276 300"/><path d="M748 170 L748 300"/>
  </g>
  <!-- M als Leiterbahn -->
  <polyline points="276,712 276,316 512,560 748,316 748,712" fill="none" stroke="#0B3B24" stroke-width="96"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="276,712 276,316 512,560 748,316 748,712" fill="none" stroke="#34D399" stroke-width="64"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Loetpunkte an den Enden -->
  <g fill="#052E16" stroke="#34D399" stroke-width="18">
    <circle cx="276" cy="712" r="40"/><circle cx="748" cy="712" r="40"/>
  </g>
  <!-- Band-LEDs -->
  <rect x="344.0" y="792" width="336" height="90" rx="14" fill="#0B0F14" stroke="#000" stroke-opacity="0.35" stroke-width="4"/><rect x="352.0" y="800" width="104" height="74" rx="10" fill="#34D399" opacity="0.30"/><rect x="360.0" y="808" width="88" height="58" rx="6" fill="#34D399"/><rect x="368.0" y="814" width="72" height="16" rx="4" fill="#FFFFFF" opacity="0.35"/><rect x="460.0" y="800" width="104" height="74" rx="10" fill="#34D399" opacity="0.30"/><rect x="468.0" y="808" width="88" height="58" rx="6" fill="#34D399"/><rect x="476.0" y="814" width="72" height="16" rx="4" fill="#FFFFFF" opacity="0.35"/><rect x="576.0" y="808" width="88" height="58" rx="6" fill="#123B27"/>
</svg>
