<?xml version="1.0" encoding="UTF-8"?>
<!-- App-Symbol von Volta (Eigenentwurf): zwei gezogene Leitungen bilden ein V und stecken in einem Kontaktfeld mit
     fuenf Steckplaetzen; der Blitz steht fuer die Elektrizitaet. Farben aus app/qml/Theme.qml. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F4B76"/>
      <stop offset="1" stop-color="#0A2540"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD45A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD45A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grundflaeche -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>

  <!-- Leuchten hinter dem Blitz -->
  <circle cx="512" cy="372" r="250" fill="url(#glow)"/>

  <!-- Blitz -->
  <path d="M566 150 L402 420 L496 420 L446 610 L640 328 L540 328 L604 150 Z"
        fill="#FFD45A" stroke="#B86A00" stroke-width="14" stroke-linejoin="round"/>

  <!-- Kontaktfeld mit fuenf Steckplaetzen -->
  <rect x="312" y="716" width="400" height="196" rx="40" fill="#CFC5AE" stroke="#9C9079" stroke-width="12"/>
  <g><rect x="352.0" y="808" width="320" height="84" rx="14" fill="#0B0F14" stroke="#000" stroke-opacity="0.35" stroke-width="4"/><rect x="360.0" y="816" width="100" height="68" rx="10" fill="#FFD45A" opacity="0.30"/><rect x="368.0" y="824" width="84" height="52" rx="6" fill="#FFC23A"/><rect x="376.0" y="830" width="68" height="15" rx="4" fill="#FFFFFF" opacity="0.35"/><rect x="470.0" y="824" width="84" height="52" rx="6" fill="#4A3B1C"/><rect x="572.0" y="824" width="84" height="52" rx="6" fill="#4A3B1C"/></g>

  <!-- Leitungen (dunkle Kontur, dann Farbe), bilden das V -->
  <g fill="none" stroke-linecap="round">
    <path d="M214 214 C 250 430, 420 620, 506 772" stroke="#7A2A00" stroke-width="104"/>
    <path d="M810 214 C 774 430, 604 620, 518 772" stroke="#7A2A00" stroke-width="104"/>
    <path d="M214 214 C 250 430, 420 620, 506 772" stroke="#FF6B1A" stroke-width="76"/>
    <path d="M810 214 C 774 430, 604 620, 518 772" stroke="#FF6B1A" stroke-width="76"/>
    <path d="M226 250 C 262 440, 420 620, 498 750" stroke="#FFB07A" stroke-width="18" opacity="0.8"/>
    <path d="M798 250 C 762 440, 604 620, 526 750" stroke="#FFB07A" stroke-width="18" opacity="0.8"/>
  </g>

  <!-- Stecker an den oberen Enden -->
  <g stroke="#0A2540" stroke-width="14">
    <circle cx="214" cy="214" r="66" fill="#F7F3EA"/>
    <circle cx="810" cy="214" r="66" fill="#F7F3EA"/>
  </g>
  <g fill="#FF6B1A">
    <circle cx="214" cy="214" r="26"/>
    <circle cx="810" cy="214" r="26"/>
  </g>
  <!-- Steckerspitze im Kontaktfeld -->
  <circle cx="512" cy="782" r="34" fill="#0A2540"/>
</svg>
